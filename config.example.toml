[server]
# The address (host:port) the HTTP server listens on.
bind_address = "127.0.0.1:8080"

[list]
# The bot account's own address. Used as the `From:` sender when relaying a
# web-submitted comment; never shown to commenters as anything but the
# technical sender ("<name> (via web) <bot_address>").
bot_address = "bot@ourdomain.example"

# The mailing list's posting address (e.g. a Google Group address). This is
# what a web-relayed comment is sent to, and what the "comment by email"
# mailto: link on the rendered page points at.
posting_address = "our-comments@googlegroups.com"

# Whether the no-JS web form relays comments into the mailing list. When
# false, the page omits the comment form and posting to the comment
# endpoint directly is rejected. Optional, defaults to true.
# relay_comments = true

# Whether the rendered page includes the mailto: "comment by email" link.
# Independent of relay_comments. Optional, defaults to true.
# show_email_link = true

# A regex matched against each comment's body; everything from the first
# match onward is stripped before rendering. Useful for a mailing list
# provider's own footer (e.g. an unsubscribe notice) that gets appended to
# every message it relays. Optional, disabled (empty) by default.
# body_footer_regex = '(?s)--\s*\nYou received this message.*'

# "auto" (follow the visitor's device), "light", or "dark". Optional,
# defaults to "auto".
# theme = "auto"

# Credentials for the bot account's own mailbox. The bot must be a normal
# subscribed member of the mailing list, so every list message is delivered
# here as a copy — no Google Groups API, no catch-all routing. A thread is
# searched for here in the background; see cache_ttl_secs below.
[imap]
host = "imap.gmail.com"
port = 993
# username and password can both be left out here and set instead via
# THREADMAIL_IMAP_USERNAME / THREADMAIL_IMAP_PASSWORD, which take
# precedence if set.
username = "bot@ourdomain.example"
password = "an-app-password-not-the-account-password"

# Credentials used to submit a web-relayed comment to the list.
[smtp]
host = "smtp.gmail.com"
port = 587
# Can also come from THREADMAIL_SMTP_USERNAME / THREADMAIL_SMTP_PASSWORD.
username = "bot@ourdomain.example"
password = "an-app-password-not-the-account-password"

# Caps on how many IMAP searches / SMTP submissions run at once, so a
# traffic spike can't hammer the mail provider. Optional — this whole
# section can be omitted to use the defaults shown below.
[limits]
max_concurrent_searches = 8
max_concurrent_submits = 4

# How long a page can be served from the local comment cache before a fresh
# IMAP search is triggered in the background. Separate from
# refresh_interval_secs below: every page check is a cache hit, but only
# ones past this TTL trigger a search. The cache is in-memory and never
# authoritative.
# cache_ttl_secs = 300

# How often (in seconds) the rendered page reloads itself to check for new
# comments. Independent of cache_ttl_secs above.
# refresh_interval_secs = 30
