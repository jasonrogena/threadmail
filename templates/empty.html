<meta http-equiv="refresh" content="{{ refresh_interval_secs }}">
{{ style_html|safe }}
<section class="thread" data-slug="{{ slug }}">
{% if just_posted %}
<p class="posted-notice">Thanks! Your comment was submitted and may take a few moments to appear here.</p>
{% endif %}
<p class="empty-state">No comments yet. Be the first.</p>
{% if !form_html.is_empty() %}
{{ form_html|safe }}
{% endif %}
{% if show_email_link %}
<p class="email-hint"><a href="mailto:{{ mailto_address }}?subject={{ slug|urlencode }}">Comment by email</a></p>
{% endif %}
</section>
